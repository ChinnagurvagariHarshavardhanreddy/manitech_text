<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: black;
    }
    table,th,td{
        margin-left: 500px;
        font-size: large;
        background-color: blueviolet;
        border: 2px solid violet;
        border-collapse: collapse;
        width: 500px;
        height: 100px;
        border-spacing: 500px;
        border-radius: 50px;
        text-align: center;
        color:white
    }
    .orange{
        background-color: orange;
    }
    .pink{
        background-color: pink; 
        color: black;
    }
    .orange:hover{
        background-color: green;
    }
    .pink:hover{
        background-color: brown;
    }
</style>
<body>
    <table>
        <tr>
            <th colspan="4" style="text-align: right;">4</th>
        </tr>
        <tr>
            <td class="pink" >AC</td>
            <td class="pink">DEL</td>
            <td class="pink">%</td>
            <td class="orange">/</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td class="orange" >*</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td class="orange">-</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td class="orange">+</td>
        </tr>
        <tr>
            <td colspan="2">0</td>
            <td>.</td>
            <td class="orange">=</td>
        </tr>
    </table>
</body>
</html>
